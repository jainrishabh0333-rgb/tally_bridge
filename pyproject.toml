[project]
name = "tally_bridge"
authors = [{ name = "SN Jain Industries", email = "md@snjainindustries.com" }]
description = "Read-only mirror of TallyPrime data in Frappe, queryable by Claude via MCP"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

# Frappe Cloud reads this to pick a compatible Frappe version when it builds
# the bench image. Without it, "Add App from GitHub" fails validation with
# "Could not find compatible Frappe version in pyproject.toml file."
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
